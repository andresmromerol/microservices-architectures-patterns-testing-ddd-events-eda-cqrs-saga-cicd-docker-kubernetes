spring.application.name=user-context
server.port=8001

eureka.instance.preferIpAddress=true
eureka.client.fetchRegistry=true
eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:8070/eureka/

management.endpoints.web.exposure.include=*
management.endpoint.shutdown.enabled=true
management.info.env.enabled=true
endpoints.shutdown.enabled=true

management.health.readiness-state.enabled=true
management.health.liveness-state.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoints.web.base-path=/actuator

logging.level.com.amr.shop.usr.user_context=DEBUG
logging.pattern.level = %5p [${spring.application.name},%X{trace_id},%X{span_id}]
management.metrics.tags.application = ${spring.application.name}

spring.datasource.url=jdbc:mysql://localhost:3306/shopdb
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.cloud.function.web.path=/functions
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.connection-timeout=10s

spring.cloud.function.definition=createUserAdministratorOnUserAuthRegistered;createUserCustomerOnUserAuthRegistered

spring.cloud.stream.bindings.createUserAdministratorOnUserAuthRegistered-in-0.destination=amr.shop.event.v1.auth.administrator.registered
spring.cloud.stream.bindings.createUserAdministratorOnUserAuthRegistered-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.createUserAdministratorOnUserAuthRegistered-in-0.contentType=application/json

spring.cloud.stream.bindings.createUserCustomerOnUserAuthRegistered-in-0.destination=amr.shop.event.v1.auth.customer.registered
spring.cloud.stream.bindings.createUserCustomerOnUserAuthRegistered-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.createUserCustomerOnUserAuthRegistered-in-0.contentType=application/json